<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=robots content="noindex,nofollow"><meta name=theme-color content="#111"><title>Owner Dashboard</title><style>*{box-sizing:border-box}body{font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;margin:0;background:#f2f3f5;color:#111;-webkit-text-size-adjust:100%}
#gate{display:flex;min-height:100vh;align-items:center;justify-content:center}#gate form{background:#fff;padding:24px;border-radius:14px;width:300px;display:flex;flex-direction:column;gap:12px}
#gate h1{font-size:20px;margin:0}#gate input[type=password]{font-size:17px;padding:12px;border:1px solid #ccc;border-radius:8px}#gate button{font-size:17px;padding:12px;border:0;border-radius:8px;background:#111;color:#fff}#err{color:#c00;margin:0;min-height:1em}
#gate label{font-size:14px;color:#555}
header{position:sticky;top:0;z-index:5;background:#111;color:#fff;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}header a{color:#9cf;text-decoration:none;font-size:15px}header h1{font-size:18px;margin:4px 0 0}header small{color:#aaa;font-size:12px}
main{padding:8px;max-width:720px;margin:0 auto}.card{background:#fff;border-radius:12px;padding:12px;margin:8px 0}.card h2{font-size:17px;margin:0 0 8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}a.tile{display:block;background:#f2f3f5;border-radius:10px;padding:10px;color:inherit;text-decoration:none}a.tile b{display:block;font-size:19px}a.tile span{font-size:12px;color:#666}a.tile:after{content:"›";float:right;color:#aaa;margin-top:-30px;font-size:22px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 4px;text-align:right;border-bottom:1px solid #eee;white-space:nowrap}td:first-child,th:first-child{text-align:left;white-space:normal}th{color:#666;font-weight:500;font-size:12px}
tr.l{cursor:pointer}tr.l td:first-child a{color:#06c;text-decoration:none}tr.l td:last-child:after{content:" ›";color:#aaa}.scroll{overflow-x:auto}
.note{font-size:12px;color:#666;margin:6px 0}.bad{color:#c00}.warn{color:#b60}.muted{color:#888}.good{color:#080}.pill{font-size:11px;padding:1px 6px;border-radius:8px;background:#eee;color:#444}
a.btn{display:inline-block;margin-top:8px;padding:10px 14px;background:#111;color:#fff;border-radius:8px;text-decoration:none}a.sw{color:#06c}</style></head><body>

async function dec(pw){const p=JSON.parse(atob(P));const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(p.s),iterations:p.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.v)},k,b64(p.c));return JSON.parse(new TextDecoder().decode(pt));}

<a class=tile href="${b}/prices"><b>${reg?'$'+G(reg.credit,3):'—'}</b><span>Regular price · vs nearby &amp; rack</span></a>
<a class=tile href="${b}/tanks"><b class="${low.length?'bad':''}">${low.length?E(low.join(', '))+' low':atstop.length?E(atstop.join(', '))+' at stop':'Tanks OK'}</b><span>${s.tanks.map(t=>(GN[t.g]||t.g)+' '+G(t.level)).join(' · ')}</span></a>
<a class=tile href="${b}/house"><b>${$(ho)}</b><span>House owed · ${$(pd)} past due</span></a></div></div>`;}
page('Owner Dashboard',null,h+`<p class=note>Columbia Citgo + Athens Chevron only. Read-only from Advantage. Tap any number for detail.</p>`);}
function diff(s){const b='#/s/'+s.code;const mos=s.days.reduce((a,d)=>a+d.os,0);
page(E(s.label)+' · Over/short',['#/','Dashboard'],`<div class=card><h2>Month to date: ${OS(mos)}</h2>${tbl(['Day','Calculated','Counted','Diff'],
s.days.slice().reverse().map(d=>row(`${b}/diff/${d.date}`,[dt(d.date),$(d.calc),$(d.calc+d.os),`<span class="${osc(d.os)}">${OS(d.os)}</span>`])))}
<p class=note>Diff = Advantage's number for the day (counted − calculated), including late drops. Tap a day for shifts and the shift paper.</p></div>`);}
function diffDay(s,d){const b='#/s/'+s.code;const x=s.days.find(z=>z.date===d);
if(!x)return page(E(s.label)+' · '+dt(d),[b+'/diff','Over/short'],`<div class=card>No shift paperwork for this day.</div>`);
const paper=x.paper?`<a class=btn href="#/paper/${s.code}/${d}">Open shift paper (${E(x.paper)})</a>`:`<p class=note>No shift paper PDF on file for this day.</p>`;
page(E(s.label)+' · '+dt(d),[b+'/diff','Over/short'],`<div class=card><h2 class="${osc(x.os)}">${OS(x.os)}</h2>${tbl(['',''],[
`<tr><td>Calculated cash</td><td>${$(x.calc)}</td></tr>`,`<tr><td>Counted (drops)</td><td>${$(x.calc+x.os)}</td></tr>`,`<tr><td>Total sales</td><td>${$(x.sales)}</td></tr>`,
`<tr><td>Fuel</td><td>${$(x.fuel)} · ${G(x.gal)} gal</td></tr>`,`<tr><td>Inside</td><td>${$(x.inside)}</td></tr>`])}${paper}</div>
<div class=card><h2>Shifts</h2>${tbl(['Shift','Status','Sales','Diff'],x.shifts.map(h=>`<tr><td>${E(h.name)}${h.confirmed?' <span class=pill>confirmed</span>':''}</td><td>${E(h.status)}</td><td>${$(h.sales)}</td><td class="${osc(h.os)}">${OS(h.os)}</td></tr>`))}
<p class=note>Shift ID${x.shifts.length>1?'s':''}: ${x.shifts.map(h=>E(h.id.slice(0,8))).join(', ')}</p></div>
<div class=card><a class=sw href="${b}/fuel/day/${d}">Fuel profit this day ›</a></div>`);}
function fuel(s){const b='#/s/'+s.code,f=s.fuel,m=f.mtd||{grades:[]};
page(E(s.label)+' · Fuel profit',['#/','Dashboard'],`<div class=card><h2>MTD ${$(m.profit)} · ${G(m.gal)} gal · ${G(m.cpg,1)}¢/gal</h2>
${tbl(['Grade','Gal','Sell','Cost','¢/gal','Profit'],m.grades.map(g=>`<tr><td>${E(g.g)}</td><td>${G(g.gal)}</td><td>$${G(g.ppu,3)}</td><td>$${G(g.cpu,3)}</td><td>${G(g.cpg,1)}</td><td>${$(g.profit)}</td></tr>`))}
<p class=note>Cost = FIFO from Jobber loads (NL Petro invoice incl. taxes + freight ÷ net gallons), same as the fuel cost audit.${m.uncosted?' '+G(m.uncosted)+' gal had no cost.':''}</p></div>
<div class=card><h2>By day</h2>${tbl(['Day','Gal','¢/gal','Profit'],f.byday.slice().reverse().map(d=>row(`${b}/fuel/day/${d.date}`,[dt(d.date),G(d.gal),G(d.cpg,1),$(d.profit)])))}</div>
<div class=card><h2>Loads (costs)</h2>${tbl(['Delivered','Invoice','Net gal','All-in/gal'],f.loads.map(l=>row(`${b}/load/${l.id}`,[dt(l.date),E(l.invoice),G(l.net),'$'+G(l.allin,4)])))}
<p class=note>Loads delivered this month plus older loads still being sold from (FIFO).</p></div>`);}
function fuelDay(s,d){const b='#/s/'+s.code;const x=s.fuel.byday.find(z=>z.date===d);
if(!x)return page(E(s.label)+' · Fuel '+dt(d),[b+'/fuel','Fuel profit'],`<div class=card>No fuel data for this day.</div>`);
page(E(s.label)+' · Fuel '+dt(d),[b+'/fuel','Fuel profit'],`<div class=card><h2>${$(x.profit)} · ${G(x.gal)} gal · ${G(x.cpg,1)}¢/gal</h2>
${tbl(['Grade','Gal','Sell','Cost','¢/gal','Profit'],x.grades.map(g=>`<tr><td>${E(g.g)}</td><td>${G(g.gal)}</td><td>$${G(g.ppu,3)}</td><td>$${G(g.cpu,3)}</td><td>${G(g.cpg,1)}</td><td>${$(g.profit)}</td></tr>`))}
<p class=note>Fuel sales ${$(x.sales)} − cost ${$(x.cost)}.</p></div><div class=card><a class=sw href="${b}/diff/${d}">Over/short this day ›</a></div>`);}
function load(s,id){const b='#/s/'+s.code;const l=s.fuel.loads.find(z=>z.id===id);if(!l)return page('Load not found',[b+'/fuel','Fuel profit'],'<div class=card>Not found.</div>');
page(E(s.label)+' · Load '+E(l.invoice),[b+'/fuel','Fuel profit'],`<div class=card><h2>${dt(l.date)} · Invoice ${E(l.invoice)}</h2>${tbl(['',''],[
`<tr><td>Status in Advantage</td><td>${E(l.status)}</td></tr>`,`<tr><td>BOL</td><td>${E(l.bol)}</td></tr>`,`<tr><td>Net / gross gal</td><td>${G(l.net)} / ${G(l.gross)}</td></tr>`,
`<tr><td>Fuel</td><td>${$(l.fuel)}</td></tr>`,`<tr><td>Taxes</td><td>${$(l.tax)}</td></tr>`,`<tr><td>Freight</td><td>${$(l.freight)}</td></tr>`,`<tr><td><b>Invoice total</b></td><td><b>${$(l.total)}</b></td></tr>`,`<tr><td>All-in per net gal</td><td>$${G(l.allin,4)}</td></tr>`])}</div>
<div class=card><h2>By grade</h2>${tbl(['Grade','Net gal','Rack/billed','All-in/gal'],l.lines.map(x=>`<tr><td>${E(x.g)}</td><td>${G(x.net)}</td><td>$${G(x.ppg,4)}</td><td>$${G(x.allin,4)}</td></tr>`))}
<p class=note>All-in = billed fuel + that grade's taxes and freight ÷ net gallons.</p></div>
<div class=card><h2>Charges</h2>${tbl(['Charge','Grade','Amount'],l.charges.map(c=>`<tr><td>${E(c.label)}</td><td>${E(c.g)}</td><td>${$(c.amt)}</td></tr>`))}</div>`);}
function inside(s,p){const b='#/s/'+s.code;const x=s.inside[p];const t=p==='y'?'yesterday':'month to date';const other=p==='y'?'mtd':'y';
if(!x)return page(E(s.label)+' · Inside',['#/','Dashboard'],'<div class=card>Not available.</div>');
const src=Object.entries(x.by_src).map(([k,v])=>`${E(k)} ${pct(v)}`).join(' · ');
page(E(s.label)+' · Inside '+t,['#/','Dashboard'],`<div class=card><h2>${$(x.sales)} sales · ~${$(x.est)} est. margin</h2>${tbl(['',''],[
`<tr><td>Sales with a cost</td><td>${$(x.cov_sales)} (${pct(x.cov)})</td></tr>`,`<tr><td>Margin on those</td><td>${pct(x.mp)}</td></tr>`,
`<tr><td>Cost found from</td><td>${src||'—'}</td></tr>`,`<tr><td>Advantage-only coverage was</td><td>${pct(x.adv_cov)}</td></tr>`])}
<p class=note>Item cost comes first from invoice lines (by UPC), then the vendor cost file, then Advantage's own cost. The margin % on costed items is applied to all sales, so it's rough. Nothing is written to Advantage.</p>
<a class=sw href="${b}/items/${p}">All items with cost source ›</a><br><a class=sw href="${b}/inside/${other}">Switch to ${p==='y'?'month to date':'yesterday'} ›</a></div>
<div class=card><h2>By department</h2>${tbl(['Dept','Sales','Costed','Margin %'],x.depts.map(d=>row(`${b}/items/${p}/${encodeURIComponent(d.name)}`,[E(d.name),$(d.sales),pct(d.cov),d.mp!=null?pct(d.mp):'—'])))}
<p class=note>Covers the top ${x.items.length} items (${pct(x.listed/x.sales)} of sales); Advantage only lists the top 500.</p></div>`);}
function items(s,p,dept){const b='#/s/'+s.code;const x=s.inside[p];if(!x)return page('Items',[b+'/inside/'+p,'Inside'],'<div class=card>Not available.</div>');
const L=x.items.filter(i=>!dept||i.dept===dept);
page(E(s.label)+' · '+(dept?E(dept):'Items')+' '+(p==='y'?'yesterday':'MTD'),[b+'/inside/'+p,'Inside'],`<div class=card>${tbl(['Item','Qty','Sales','Cost ea','Margin'],
L.map(i=>`<tr><td>${E(i.name)}<br><small>${E(i.src||'no cost found')}</small></td><td>${G(i.qty)}</td><td>${$(i.sales)}</td><td>${i.unit!=null?$(i.unit):'—'}</td><td>${i.m!=null?pct(i.m):'—'}</td></tr>`))}
<p class=note>${L.length} items. Costs outside 15–105% of the selling price are ignored as bad reads.</p></div>`);}
function cards(s){const b='#/s/'+s.code,c=s.cards;
page(E(s.label)+' · Card deposits',['#/','Dashboard'],`<div class=card><h2>${c.n_comp} days compared: NL Petro ${$(c.matched_nlp)} vs Advantage ${$(c.matched_adv)}</h2>
${tbl(['Day','NL Petro','Advantage','Diff'],c.days.slice().reverse().map(d=>`<tr><td>${dt(d.date)}${d.rem?'<br><small>open '+$(d.rem)+'</small>':''}</td><td>${d.nlp!=null?$(d.nlp):'<span class=muted>not posted</span>'}</td><td>${$(d.adv)}</td><td class="${d.diff!=null&&Math.abs(d.diff)>5000?'bad':''}">${d.diff!=null?$(d.diff,true):'—'}</td></tr>`))}
<p class=note>NL Petro POS credit card Amount vs Advantage MOP-Network (credit+debit+mobile). Diff = NL Petro − Advantage. NL Petro side from Batches' last pull (${E(c.src_time||'none')}); Advantage live.</p></div>`);}
function prices(s){const b='#/s/'+s.code,P=s.prices;const r=P.rack,t=P.tonight;const RK={regular:'87',prem:'93',diesel:'diesel'};
const ours=P.ours.map(o=>{const ai=r&&r.all_in?r.all_in[RK[o.g]]:null;return`<tr><td>${GN[o.g]||E(o.g)}</td><td>$${G(o.cash,3)}</td><td>$${G(o.credit,3)}</td><td>${ai?'$'+G(ai,3):'—'}</td><td>${ai?G((o.credit-ai)*100,0)+'¢':'—'}</td></tr>`});
const near=P.nearby.filter(n=>Object.keys(n.p).length&&!n.mine).slice(0,10);
page(E(s.label)+' · Pump prices',['#/','Dashboard'],`<div class=card><h2>Our prices</h2>${tbl(['Grade','Cash','Credit','Rack','Margin'],ours)}
<p class=note>Posted prices in Advantage. Rack all-in = NL Petro total with tax + freight, effective ${E(r?.effective||'—')}. Margin = credit price − rack all-in (what a new load would earn).</p></div>
<div class=card><h2>Tonight's rack move</h2>${t&&Object.keys(t.move_cents).length?tbl(['Grade','Expected move','New all-in'],Object.entries(t.move_cents).map(([g,v])=>`<tr><td>${E(g)}</td><td class="${v>0?'bad':'good'}">${v>0?'+':''}${G(v,1)}¢</td><td>$${G(t.after6[g],3)}</td></tr>`)):`<p>No new move pending. The ${E(r?.effective||'')} price ${t?.weekend_hold?'holds through the weekend until Mon 6pm ET':'is the latest'}; Rack posts the next guess around 6pm ET on weekdays.</p>`}
<p class=note>From Rack's latest guess (${E(t?.file||'—')}, dated ${E(t?.date||'—')}). ${t?.weekend_hold?'Friday price holds through the weekend until Mon 6pm ET.':''}</p></div>
<div class=card><h2>Nearby stations</h2>${near.length?tbl(['Station','Mi','Reg','Prem','Diesel'],near.map(n=>`<tr><td>${E(n.name)}<br><small>${E(n.addr)}</small></td><td>${G(n.mi,1)}</td><td>${n.p.regular?'$'+G(n.p.regular.credit||n.p.regular.cash,2):'—'}</td><td>${n.p.prem?'$'+G(n.p.prem.credit||n.p.prem.cash,2):'—'}</td><td>${n.p.diesel?'$'+G(n.p.diesel.credit||n.p.diesel.cash,2):'—'}</td></tr>`)):'<p class=note>No nearby prices available.</p>'}
<p class=note>GasBuddy public prices (credit, or cash if no credit), user-reported and may be hours old. ${P.errors.map(E).join(' ')}</p></div>`);}
function pnl(s){const b='#/s/'+s.code,p=s.pnl;
page(E(s.label)+' · P&amp;L MTD',['#/','Dashboard'],`<div class=card><h2>Rough net ${$(p.net)}</h2>${tbl(['',''],[
row(b+'/fuel',['Fuel profit',$(p.fuel)]),row(b+'/inside/mtd',['Inside profit (est.)',$(p.inside)]),row(b+'/pnl/exp',['− Expenses',$(-p.exp)]),row(b+'/pnl/pay',['− Payroll',$(-p.pay)]),`<tr><td><b>Net</b></td><td><b>${$(p.net)}</b></td></tr>`])}
<p class=note>Month to date. Expenses and payroll are what was paid out and entered in Advantage. Payroll = entries with "payroll" in the note or paid to a person. Not included: rent, utilities paid outside the store, card fees, NL Petro fees, taxes. Inventory purchases (${$(p.purch)}) aren't subtracted because inside profit already uses item cost.</p>
<a class=sw href="${b}/scans">Purchases list ›</a></div>`);}
function plist(s,kind){const b='#/s/'+s.code,p=s.pnl;const L=kind==='pay'?p.payroll:p.expenses;
page(E(s.label)+' · '+(kind==='pay'?'Payroll':'Expenses')+' MTD',[b+'/pnl','P&L'],`<div class=card><h2>${$(L.reduce((a,x)=>a+x.amt,0))}</h2>${L.length?tbl(['Day','Paid to','Amount'],L.map(x=>`<tr><td>${dt(x.date)}</td><td>${E(x.who)}${x.note?'<br><small>'+E(x.note)+'</small>':''}</td><td>${$(x.amt)}</td></tr>`)):'<p class=note>None this month.</p>'}</div>`);}
function scans(s){const b='#/s/'+s.code,L=s.pnl.purchases;const ns=L.filter(x=>!x.scan);
page(E(s.label)+' · Purchases MTD',['#/','Dashboard'],`<div class=card><h2>${ns.length} of ${L.length} purchases missing an invoice scan</h2>${L.length?tbl(['Day','Vendor','Amount','Scan'],L.map(x=>`<tr><td>${dt(x.date)}</td><td>${E(x.who)}${x.check?'<br><small>chk '+E(x.check)+'</small>':''}</td><td>${$(x.amt)}</td><td>${x.scan?'✓':'<span class=bad>missing</span>'}</td></tr>`)):'<p class=note>No purchases this month.</p>'}</div>`);}
function tanks(s){const b='#/s/'+s.code;page(E(s.label)+' · Tanks',['#/','Dashboard'],`<div class=card>${tbl(['Grade','Gallons','Avg/day','Days to stop'],
s.tanks.map(t=>row(`${b}/tank/${t.g}`,[GN[t.g]||E(t.g),G(t.level),G(t.avg),t.level<=t.stop?'<b class=bad>AT STOP</b>':`<span class="${t.days!=null&&t.days<3?'bad':''}">${G(t.days,1)}</span>`])))}
<p class=note>Latest reading in Advantage (${dt(s.tanks[0]?.asof)}). Days to stop = (gallons − stop) ÷ 7-day average sold. Stop ${s.tanks.map(t=>(GN[t.g]||t.g)+' '+t.stop).join(', ')} gal.</p></div>`);}
function tank(s,g){const b='#/s/'+s.code;const t=s.tanks.find(z=>z.g===g);if(!t)return page('Tank not found',[b+'/tanks','Tanks'],'<div class=card>Not found.</div>');
page(E(s.label)+' · '+(GN[g]||E(g)),[b+'/tanks','Tanks'],`<div class=card><h2>${G(t.level)} gal · ${t.level<=t.stop?'AT STOP':G(t.days,1)+' days to stop'}</h2>
${tbl(['Day','Open','Delivered','Sold','Close','+/−'],t.rows.slice().reverse().map(r=>`<tr><td>${dt(r.date)}</td><td>${G(r.openGal)}</td><td>${r.deliveredGal?G(r.deliveredGal):''}</td><td>${G(r.soldGal)}</td><td>${G(r.closeGal??r.bookCloseGal)}</td><td>${G(r.overShortGal,1)}</td></tr>`))}
<p class=note>Close = stick reading (book if no stick yet). +/− = stick vs book gallons.</p></div>`);}
function house(s){const b='#/s/'+s.code;const ho=s.house.filter(a=>a.bal>0).reduce((a,x)=>a+x.bal,0);
page(E(s.label)+' · House accounts',['#/','Dashboard'],`<div class=card><h2>${$(ho)} owed</h2>${tbl(['Account','Balance','Past due'],
s.house.map(a=>row(`${b}/house/${a.id}`,[E(a.name),$(a.bal),a.pastdue?`<span class=bad>${$(a.pastdue)}</span>`:''])))}
<p class=note>As of end of ${dt(D.yesterday)}. GM / Daily G and COAM gift cards left out; credit (negative) balances not in the total.</p></div>`);}
function acct(s,id){const b='#/s/'+s.code;const a=s.house.find(z=>z.id===id);if(!a)return page('Account not found',[b+'/house','House accounts'],'<div class=card>Not found.</div>');
page(E(s.label)+' · '+E(a.name),[b+'/house','House accounts'],`<div class=card><h2>${$(a.bal)} balance</h2>${tbl(['',''],[`<tr><td>Past due</td><td>${$(a.pastdue)}</td></tr>`,`<tr><td>Next payment date</td><td>${a.next?dt(a.next):'—'}</td></tr>`,`<tr><td>Balance at start of month</td><td>${$(a.opening)}</td></tr>`])}</div>
<div class=card><h2>Ledger this month</h2>${a.events.length?tbl(['Day','Type','Amount','Balance'],a.events.map(e=>`<tr><td>${dt(e.date)}${e.fuel?`<br><small>${E(e.fuel)} ${e.gal?G(e.gal,1)+' gal':''}</small>`:''}${e.pm?`<br><small>${E(e.pm)}</small>`:''}${e.note?`<br><small>${E(e.note)}</small>`:''}</td><td>${E(e.type)}</td><td>${$(e.amt)}</td><td>${$(e.run)}</td></tr>`)):'<p class=note>No activity this month.</p>'}</div>`);}
function paper(code,d){const s=S(code);const k=code+'/'+d;const b64d=D.papers[k];if(!s||!b64d)return page('Shift paper',['#/','Dashboard'],'<div class=card>No PDF.</div>');
const url=URL.createObjectURL(new Blob([b64(b64d)],{type:'application/pdf'}));
page(E(s.label)+' · Shift paper '+dt(d),[`#/s/${code}/diff/${d}`,dt(d)],`<div class=card><a class=btn href="${url}" target=_blank rel=noopener>Open PDF</a> <a class=btn href="${url}" download="${E(s.paperName||'')}${code}-shift-paper-${d}.pdf">Download</a>
<iframe src="${url}" style="width:100%;height:70vh;border:0;margin-top:10px"></iframe></div>`);}
function route(){const h=location.hash.replace(/^#\/?/,'').split('/');try{
if(h[0]==='s'&&S(h[1])){const s=S(h[1]);switch(h[2]){
case'diff':return h[3]?diffDay(s,h[3]):diff(s);case'fuel':return h[3]==='day'?fuelDay(s,h[4]):fuel(s);case'load':return load(s,h[3]);
case'inside':return inside(s,h[3]==='y'?'y':'mtd');case'items':return items(s,h[3]==='y'?'y':'mtd',h[4]?decodeURIComponent(h[4]):null);case'cards':return cards(s);case'prices':return prices(s);case'pnl':return h[3]?plist(s,h[3]):pnl(s);case'scans':return scans(s);case'tanks':return tanks(s);case'tank':return tank(s,h[3]);case'house':return h[3]?acct(s,h[3]):house(s);}}
if(h[0]==='paper')return paper(h[1],h[2]);}catch(e){console.error(e);return page('Error',['#/','Dashboard'],'<div class=card>Something went wrong: '+E(e.message)+'</div>');}
home();}
</script></body></html>
